<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo Tambul | Aceitunas de Caramarca</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f4;
            color: #2c3e2d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 20px;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            letter-spacing: 1px;
            color: #3b5336;
        }
        p {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
        }
        /* Estilos del Carrusel */
        .carousel {
            position: relative;
            width: 100%;
            height: 280px;
            overflow: hidden;
            border-radius: 8px;
            margin: 20px 0;
            background-color: #eee;
        }
        .carousel-track {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.5s ease-in-out;
        }
        .carousel-slide {
            min-width: 100%;
            height: 100%;
        }
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Botones de contacto */
        .contact-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn:hover {
            transform: translateY(-1px);
        }
        .btn-whatsapp {
            background-color: #25D366;
            color: white;
        }
        .btn-whatsapp:hover {
            background-color: #20ba5a;
        }
        .btn-gmail {
            background-color: #EA4335;
            color: white;
        }
        .btn-gmail:hover {
            background-color: #d33426;
        }
        .btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <!-- 
      Página en construcción para Grupo Tambul (Caramarca, Catamarca)
      Mensaje provisional para la web informativa inicial.
    -->

    <div class="container">
        <h1>GRUPO TAMBUL</h1>
        <p>Estamos trabajando en nuestro sitio web informativo sobre nuestros olivares y producción en Caramarca.</p>
        
        <!-- Carrusel con las 8 imágenes -->

            <div class="carousel-track" id="carouselTrack">

                <div class="carousel-slide"><img src="images/foto3.jpg" alt="Olivares Grupo Tambul 3"></div>
                <div class="carousel-slide"><img src="images/foto4.jpg" alt="Olivares Grupo Tambul 4"></div>
                <div class="carousel-slide"><img src="images/foto5.JPG" alt="Olivares Grupo Tambul 5"></div>
                <div class="carousel-slide"><img src="images/foto6.JGP" alt="Olivares Grupo Tambul 6"></div>
                <div class="carousel-slide"><img src="images/foto7.JPG" alt="Olivares Grupo Tambul 7"></div>
                <div class="carousel-slide"><img src="images/foto8.JPG" alt="Olivares Grupo Tambul 8"></div>
            </div>
        </div>

        <p><strong>Pronto estará disponible. Disculpe las molestias.</strong></p>
        
        <!-- Botones de contacto -->
        <div class="contact-buttons">
            <a href="https://wa.me/5491156680181?text=Hola,%20quiero%20más%20información%20sobre%20Grupo%20Tambul." target="_blank" rel="noopener noreferrer" class="btn btn-whatsapp">

                WhatsApp
            </a>

                Correo / Gmail
            </a>
        </div>

        <div class="footer">
            Grupo Tambul &copy; 2026
        </div>
    </div>

    <!-- Script del carrusel automático -->
    <script>
        const track = document.getElementById('carouselTrack');
        const slides = Array.from(track.children);
        let currentIndex = 0;

        function moveToNextSlide() {
            currentIndex = (currentIndex + 1) % slides.length;
            track.style.transform = 'translateX(-' + (currentIndex * 100) + '%)';
        }

        setInterval(moveToNextSlide, 3000); // Rota automáticamente cada 3 segundos
    </script>

</body>
</html>
